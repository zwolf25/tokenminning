<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Tokenmaxxing versus Tokenminning</title><desc id="d">Five paired shifts: add more context becomes better context, bigger prompts become denser, load everything becomes retrieve what matters, more memory becomes better memory architecture, more tokens becomes more intelligence per token.</desc><defs><marker id="a-9AA3B2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3B2"/></marker><marker id="a-10C99A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10C99A"/></marker><marker id="a-F0A04B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0A04B"/></marker><marker id="a-F0716A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0716A"/></marker></defs><rect width="1200" height="640" rx="20" fill="#111318"/><text x="600.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#E8EAED" text-anchor="middle">Tokenmaxxing  →  Tokenminning</text><text x="600.0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9AA3B2" text-anchor="middle">From maximizing tokens to maximizing intelligence per token</text><rect x="50" y="130" width="520" height="440" rx="12" fill="#1A1D24" stroke="#F0A04B" stroke-width="1.5"/><rect x="630" y="130" width="520" height="440" rx="12" fill="#1A1D24" stroke="#10C99A" stroke-width="1.5"/><text x="90" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#F0A04B" text-anchor="start">TOKENMAXXING</text><text x="670" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#10C99A" text-anchor="start">TOKENMINNING</text><text x="90" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9AA3B2" text-anchor="start">Add more context</text><text x="670" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#E8EAED" text-anchor="start">Add better context</text><text x="90" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9AA3B2" text-anchor="start">Bigger prompts</text><text x="670" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#E8EAED" text-anchor="start">Denser prompts</text><text x="90" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9AA3B2" text-anchor="start">Load everything</text><text x="670" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#E8EAED" text-anchor="start">Retrieve what matters</text><text x="90" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9AA3B2" text-anchor="start">More memory</text><text x="670" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#E8EAED" text-anchor="start">Better memory architecture</text><text x="90" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9AA3B2" text-anchor="start">More tokens</text><text x="670" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#E8EAED" text-anchor="start">More intelligence per token</text><path d="M585 350 h30" stroke="#10C99A" stroke-width="4" marker-end="url(#a-10C99A)"/><text x="600.0" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9AA3B2" text-anchor="middle">The question changes from “how much context?” to “which context?”</text></svg>
