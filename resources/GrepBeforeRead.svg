<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">Grep before read</title><desc id="d">Reading all 402 files versus filtering with grep first and reading 31: 371 files skipped, 92 percent fewer reads, $1.20 saved per run.</desc><defs><marker id="a-9AA3B2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3B2"/></marker><marker id="a-10C99A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10C99A"/></marker><marker id="a-F0A04B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0A04B"/></marker><marker id="a-F0716A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0716A"/></marker></defs><rect width="1200" height="600" rx="20" fill="#111318"/><text x="600.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#E8EAED" text-anchor="middle">Grep Before Read</text><text x="600.0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9AA3B2" text-anchor="middle">Filter first, then read only the files that match</text><rect x="50" y="130" width="520" height="280" rx="12" fill="#1A1D24" stroke="#F0716A" stroke-width="1.5"/><text x="80" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#F0716A" text-anchor="start">READ EVERYTHING</text><text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#E8EAED" text-anchor="start">402</text><text x="240" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9AA3B2" text-anchor="start">files read</text><text x="80" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9AA3B2" text-anchor="start">Every file is opened and checked</text><text x="80" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9AA3B2" text-anchor="start">for a match.</text><rect x="630" y="130" width="520" height="280" rx="12" fill="#1A1D24" stroke="#10C99A" stroke-width="1.5"/><text x="660" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#10C99A" text-anchor="start">GREP, THEN READ</text><text x="660" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#10C99A" text-anchor="start">31</text><text x="760" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9AA3B2" text-anchor="start">files read</text><text x="660" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9AA3B2" text-anchor="start">402 files → grep filter → 31 matches</text><text x="660" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9AA3B2" text-anchor="start">→ read → process.</text><path d="M575 270 h50" stroke="#10C99A" stroke-width="4" marker-end="url(#a-10C99A)"/><rect x="50" y="440" width="340" height="120" rx="12" fill="#1A1D24" stroke="#2E3440" stroke-width="1.5"/><text x="78" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#10C99A" text-anchor="start">371</text><text x="78" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9AA3B2" text-anchor="start">files skipped</text><rect x="430" y="440" width="340" height="120" rx="12" fill="#1A1D24" stroke="#2E3440" stroke-width="1.5"/><text x="458" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#10C99A" text-anchor="start">92%</text><text x="458" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9AA3B2" text-anchor="start">fewer reads</text><rect x="810" y="440" width="340" height="120" rx="12" fill="#1A1D24" stroke="#2E3440" stroke-width="1.5"/><text x="838" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#10C99A" text-anchor="start">$1.20</text><text x="838" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9AA3B2" text-anchor="start">saved per run</text></svg>
