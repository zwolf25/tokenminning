<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">Retrieval escalation ladder</title><desc id="d">Three levels: local wiki costs no extra tokens and serves about 60 percent of lookups, stub pointers cost 50 to 100 tokens for about 30 percent, live reads cost 2K to 5K tokens for about 10 percent.</desc><defs><marker id="a-9AA3B2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3B2"/></marker><marker id="a-10C99A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10C99A"/></marker><marker id="a-F0A04B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0A04B"/></marker><marker id="a-F0716A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0716A"/></marker></defs><rect width="1200" height="600" rx="20" fill="#111318"/><text x="600.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#E8EAED" text-anchor="middle">Retrieval Escalation Ladder</text><text x="600.0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9AA3B2" text-anchor="middle">Start at the bottom. Climb only when the step below cannot answer.</text><rect x="280.0" y="150" width="640" height="110" rx="14" fill="#1A1D24" stroke="#F0A04B" stroke-width="2.5"/><text x="308.0" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EAED" text-anchor="start">Level 3 · Live read</text><text x="308.0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9AA3B2" text-anchor="start">Full content, read on demand</text><text x="892.0" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#F0A04B" text-anchor="end">2K–5K tokens</text><text x="892.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#9AA3B2" text-anchor="end">~10% of lookups</text><rect x="200.0" y="280" width="800" height="110" rx="14" fill="#1A1D24" stroke="#4FB3D9" stroke-width="2.5"/><text x="228.0" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EAED" text-anchor="start">Level 2 · Stub pointer</text><text x="228.0" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9AA3B2" text-anchor="start">Summary plus a path to the source</text><text x="972.0" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#4FB3D9" text-anchor="end">50–100 tokens</text><text x="972.0" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#9AA3B2" text-anchor="end">~30% of lookups</text><rect x="120.0" y="410" width="960" height="110" rx="14" fill="#1A1D24" stroke="#10C99A" stroke-width="2.5"/><text x="148.0" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EAED" text-anchor="start">Level 1 · Local wiki</text><text x="148.0" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9AA3B2" text-anchor="start">Already loaded, instant</text><text x="1052.0" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#10C99A" text-anchor="end">0 extra tokens</text><text x="1052.0" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#9AA3B2" text-anchor="end">~60% of lookups</text><line x1="1130" y1="160" x2="1130" y2="520" stroke="#10C99A" stroke-width="3" marker-end="url(#a-10C99A)"/><g transform="translate(1108,340) rotate(-90)"><text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA3B2" text-anchor="middle">cheaper · faster · more frequent</text></g></svg>
