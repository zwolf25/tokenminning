<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Context surface</title><desc id="d">The entire system feeds a context surface, which feeds the model, which produces reasoning. Tokenminning optimizes the context surface.</desc><defs><marker id="a-9AA3B2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3B2"/></marker><marker id="a-10C99A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10C99A"/></marker><marker id="a-F0A04B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0A04B"/></marker><marker id="a-F0716A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0716A"/></marker></defs><rect width="1200" height="640" rx="20" fill="#111318"/><text x="600.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#E8EAED" text-anchor="middle">Context Surface</text><text x="600.0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9AA3B2" text-anchor="middle">Optimize what crosses the boundary, not how much knowledge exists</text><rect x="260" y="130" width="680" height="110" rx="12" fill="#1A1D24" stroke="#2E3440" stroke-width="1.5"/><text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EAED" text-anchor="middle">Entire system</text><text x="600" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#9AA3B2" text-anchor="middle">files · tools · memory · history · logs</text><line x1="600" y1="244" x2="600" y2="296" stroke="#9AA3B2" stroke-width="3" marker-end="url(#a-9AA3B2)"/><rect x="260" y="300" width="680" height="110" rx="14" fill="#12241F" stroke="#10C99A" stroke-width="3"/><text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#10C99A" text-anchor="middle">Context surface</text><text x="600" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#E8EAED" text-anchor="middle">the only part the model sees</text><line x1="600" y1="414" x2="600" y2="456" stroke="#10C99A" stroke-width="3" marker-end="url(#a-10C99A)"/><rect x="400" y="460" width="400" height="60" rx="12" fill="#1A1D24" stroke="#2E3440" stroke-width="1.5"/><text x="600" y="499" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#E8EAED" text-anchor="middle">Model</text><line x1="600" y1="524" x2="600" y2="556" stroke="#9AA3B2" stroke-width="3" marker-end="url(#a-9AA3B2)"/><rect x="400" y="560" width="400" height="56" rx="12" fill="#1A1D24" stroke="#2E3440" stroke-width="1.5"/><text x="600" y="597" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#E8EAED" text-anchor="middle">Reasoning</text><text x="960" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#10C99A" text-anchor="start">Tokenminning works here.</text><text x="960" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9AA3B2" text-anchor="start">Not prompt compression.</text><path d="M942 355 h-0" /></svg>
