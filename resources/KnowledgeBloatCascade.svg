<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1100" width="760" height="1100" role="img" aria-labelledby="t d"><title id="t">Knowledge bloat cascade</title><desc id="d">Shared wikis cloned 68 times lead to 45 stale copies (66 percent), conflict copies (1.6 MB duplicated) and silent drift costing 4 to 8 dollars per AI session.</desc><defs><marker id="a-9AA3B2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA3B2"/></marker><marker id="a-10C99A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10C99A"/></marker><marker id="a-F0A04B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0A04B"/></marker><marker id="a-F0716A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F0716A"/></marker></defs><rect width="760" height="1100" rx="20" fill="#111318"/><text x="380.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#E8EAED" text-anchor="middle">Knowledge Bloat Cascade</text><text x="380.0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9AA3B2" text-anchor="middle">How full-body copies drift into silent failure</text><rect x="80" y="140" width="600" height="120" rx="14" fill="#1A1D24" stroke="#10C99A" stroke-width="2.5"/><text x="110" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E8EAED" text-anchor="start">Shared wikis</text><text x="110" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#10C99A" text-anchor="start">one source of truth</text><line x1="380" y1="264" x2="380" y2="320" stroke="#9AA3B2" stroke-width="3" marker-end="url(#a-9AA3B2)"/><rect x="80" y="328" width="600" height="120" rx="14" fill="#1A1D24" stroke="#4FB3D9" stroke-width="2.5"/><text x="110" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E8EAED" text-anchor="start">68 full clones</text><text x="110" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#4FB3D9" text-anchor="start">every collaborator copies everything</text><line x1="380" y1="452" x2="380" y2="508" stroke="#9AA3B2" stroke-width="3" marker-end="url(#a-9AA3B2)"/><rect x="80" y="516" width="600" height="120" rx="14" fill="#1A1D24" stroke="#F0A04B" stroke-width="2.5"/><text x="110" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E8EAED" text-anchor="start">45 stale copies</text><text x="110" y="606" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#F0A04B" text-anchor="start">66% outdated</text><line x1="380" y1="640" x2="380" y2="696" stroke="#9AA3B2" stroke-width="3" marker-end="url(#a-9AA3B2)"/><rect x="80" y="704" width="600" height="120" rx="14" fill="#1A1D24" stroke="#E27D4A" stroke-width="2.5"/><text x="110" y="758" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E8EAED" text-anchor="start">Conflict copies</text><text x="110" y="794" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E27D4A" text-anchor="start">1.6 MB duplicated</text><line x1="380" y1="828" x2="380" y2="884" stroke="#9AA3B2" stroke-width="3" 